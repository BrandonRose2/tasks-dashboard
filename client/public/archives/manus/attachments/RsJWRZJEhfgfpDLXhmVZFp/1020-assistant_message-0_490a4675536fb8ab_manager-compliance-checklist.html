<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Compliance Checklist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1b2a;
            color: #e2e8f0;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            color: #e89f1f;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #63738a;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .progress-bar {
            background: #1b2838;
            border-radius: 8px;
            height: 12px;
            margin-bottom: 32px;
            overflow: hidden;
            border: 1px solid #2a3a4a;
        }
        .progress-fill {
            background: linear-gradient(90deg, #e89f1f, #f5c542);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 8px;
        }
        .progress-text {
            text-align: center;
            color: #93a2b7;
            font-size: 13px;
            margin-bottom: 24px;
            margin-top: -24px;
        }
        .manager-card {
            background: #1b2838;
            border: 1px solid #2a3a4a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        .manager-card.completed {
            border-color: #22c55e;
            opacity: 0.7;
        }
        .manager-card h2 {
            font-size: 20px;
            color: #f1f5f9;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2a3a4a;
        }
        .checklist-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            cursor: pointer;
            user-select: none;
        }
        .checklist-item:hover {
            background: rgba(232, 159, 31, 0.05);
            border-radius: 6px;
            margin: 0 -8px;
            padding: 10px 8px;
        }
        .checklist-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            min-width: 20px;
            margin-top: 2px;
            accent-color: #e89f1f;
            cursor: pointer;
        }
        .checklist-item label {
            font-size: 15px;
            color: #cbd5e1;
            cursor: pointer;
            line-height: 1.4;
        }
        .checklist-item.checked label {
            text-decoration: line-through;
            color: #63738a;
        }
        .timestamp {
            font-size: 11px;
            color: #4a5568;
            margin-top: 4px;
        }
        .reset-btn {
            display: block;
            margin: 32px auto 0;
            padding: 12px 24px;
            background: #2a3a4a;
            color: #93a2b7;
            border: 1px solid #3a4a5a;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reset-btn:hover {
            background: #3a4a5a;
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Manager Compliance Checklist</h1>
        <p class="subtitle">From Marc — Action Items for Follow-Up</p>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p class="progress-text" id="progressText">0 of 17 completed</p>

        <div class="manager-card" id="card-jefferson">
            <h2>Jefferson</h2>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="j1">
                <label for="j1">Not checking off to-dos in phone calls</label>
            </div>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="j2">
                <label for="j2">Not going through tasks</label>
            </div>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="j3">
                <label for="j3">Needs to ask "How did you hear about us?"</label>
            </div>
        </div>

        <div class="manager-card" id="card-deon">
            <h2>Deon Toliver</h2>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="d1">
                <label for="d1">Not checking off to-dos in phone calls</label>
            </div>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="d2">
                <label for="d2">Not going through tasks</label>
            </div>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="d3">
                <label for="d3">Needs to ask "How did you hear about us?"</label>
            </div>
        </div>

        <div class="manager-card" id="card-erica">
            <h2>Erica Finch</h2>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="e1">
                <label for="e1">Not checking off to-dos in phone calls</label>
            </div>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="e2">
                <label for="e2">Not going through tasks</label>
            </div>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="e3">
                <label for="e3">Needs to ask "How did you hear about us?"</label>
            </div>
        </div>

        <div class="manager-card" id="card-james">
            <h2>James Abeyta</h2>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="ja1">
                <label for="ja1">Not checking off to-dos in phone calls</label>
            </div>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="ja2">
                <label for="ja2">Not going through tasks</label>
            </div>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="ja3">
                <label for="ja3">Needs to ask "How did you hear about us?"</label>
            </div>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="ja4">
                <label for="ja4">Not following the script at all</label>
            </div>
        </div>

        <div class="manager-card" id="card-haily">
            <h2>Haily</h2>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="h1">
                <label for="h1">Not checking off to-dos in phone calls</label>
            </div>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="h2">
                <label for="h2">Not going through tasks</label>
            </div>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="h3">
                <label for="h3">Needs to ask "How did you hear about us?"</label>
            </div>
            <div class="checklist-item" onclick="toggle(this)">
                <input type="checkbox" id="h4">
                <label for="h4">Not following the script at all</label>
            </div>
        </div>

        <button class="reset-btn" onclick="resetAll()">Reset All Checkboxes</button>
    </div>

    <script>
        // Load saved state
        function loadState() {
            const saved = localStorage.getItem('managerChecklist');
            if (saved) {
                const state = JSON.parse(saved);
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    if (state[cb.id]) {
                        cb.checked = true;
                        cb.closest('.checklist-item').classList.add('checked');
                    }
                });
            }
            updateProgress();
        }

        function toggle(item) {
            const cb = item.querySelector('input[type="checkbox"]');
            cb.checked = !cb.checked;
            item.classList.toggle('checked', cb.checked);
            saveState();
            updateProgress();
        }

        function saveState() {
            const state = {};
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                state[cb.id] = cb.checked;
            });
            localStorage.setItem('managerChecklist', JSON.stringify(state));
        }

        function updateProgress() {
            const total = document.querySelectorAll('input[type="checkbox"]').length;
            const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
            const pct = Math.round((checked / total) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = checked + ' of ' + total + ' completed';

            // Mark cards as completed
            document.querySelectorAll('.manager-card').forEach(card => {
                const cardTotal = card.querySelectorAll('input[type="checkbox"]').length;
                const cardChecked = card.querySelectorAll('input[type="checkbox"]:checked').length;
                card.classList.toggle('completed', cardTotal === cardChecked);
            });
        }

        function resetAll() {
            if (confirm('Reset all checkboxes?')) {
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                    cb.closest('.checklist-item').classList.remove('checked');
                });
                localStorage.removeItem('managerChecklist');
                updateProgress();
            }
        }

        // Prevent double-toggle from checkbox click
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('click', (e) => e.stopPropagation());
            cb.addEventListener('change', () => {
                cb.closest('.checklist-item').classList.toggle('checked', cb.checked);
                saveState();
                updateProgress();
            });
        });

        loadState();
    </script>
</body>
</html>
