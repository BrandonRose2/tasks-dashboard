<!DOCTYPE html>
<html lang="en">
<head>

<!--
  ============================================================
  Brandon Rose — Email Signature
  Outlook Exchange Compatible HTML Signature
  ============================================================
  INSTRUCTIONS FOR OUTLOOK:
  1. Open Outlook → File → Options → Mail → Signatures
  2. Create a new signature, click "Edit" in the web editor
     OR paste this HTML into the signature editor
  3. Save and set as default for new messages / replies
  
  NOTE: Images must be embedded or hosted online for them
  to display properly in all email clients.
  ============================================================
-->
</head>
<body style="margin:0;padding:0;background-color:#ffffff;">

        <span style="color:#C8A84B;font-style:italic;font-weight:bold;">Office&nbsp;</span>
